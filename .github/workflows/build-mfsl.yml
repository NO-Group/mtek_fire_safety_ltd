## MFSL Inventory — cloud build (APK + Windows EXE/MSIX)
##
## Manual trigger only: Actions tab -> "Build MFSL Inventory (APK + EXE)"
## -> Run workflow, pick this branch. No secrets required: the app's default
## server URL + public anon key are already baked into app/lib/data/env.dart.
##
## Produces two downloadable artifacts on the run page:
##   - MFSL-Inventory-apk     (MFSL Inventory.apk)
##   - MFSL-Inventory-windows (MFSL Inventory Setup.msix + MFSL Inventory.exe + full Release folder)

name: Build MFSL Inventory (APK + EXE)

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build APK (release)
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk "../out/MFSL Inventory.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MFSL-Inventory-apk
          path: out/MFSL Inventory.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build EXE (release) + MSIX installer
        working-directory: app
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
          $OUT = "build\windows\x64\runner\Release"
          Copy-Item "$OUT\mtek_inventory.exe" "$OUT\MFSL Inventory.exe"
          dart run msix:create
          Copy-Item "$OUT\MFSL-Inventory-Setup.msix" "$OUT\MFSL Inventory Setup.msix"
      - uses: actions/upload-artifact@v4
        with:
          name: MFSL-Inventory-windows
          path: app/build/windows/x64/runner/Release
