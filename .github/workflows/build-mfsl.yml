## MFSL Inventory - cloud build (APK + Windows installer)
##
## This file is intentionally MINIMAL and should never need editing again:
## ALL build logic lives in ci/build-android.sh and ci/build-windows.ps1
## (normal git-push files). Editing anything under .github/workflows/ needs a
## token with the special GitHub "workflows" permission, which is exactly what
## broke pushes before - so keep this file small and stable on purpose.
##
## Outputs (no artifacts, no zip wrappers, no passwords):
##   A rolling pre-release tagged "ci" on the Releases page with RAW assets:
##     - MFSL.Inventory.apk
##     - MFSL.Inventory.Setup.msix
##     - MFSL-Inventory-portable.zip (portable Release folder, zipped by us)
##   GitHub NEVER re-zips or encrypts release assets (unlike Actions
##   artifacts), so downloads are exactly these files - nothing to extract.
##   (Dot names: GitHub replaces spaces in release asset names with dots.)
##
## Runs: manually (Actions tab), or automatically on pushes to main or to the
## working branch that touch app/, ci/ or this file.

name: Build MFSL Inventory (APK + EXE)

on:
  workflow_dispatch:
  push:
    branches: [main, arena/**]
    paths: ['app/**', 'ci/**', '.github/workflows/build-mfsl.yml']

# Serialize runs so two builds never fight over the rolling "ci" release.
concurrency:
  group: mfsl-inventory-build
  cancel-in-progress: false

permissions:
  contents: write # required to create/update the "ci" release

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK & publish to rolling release
        run: bash ci/build-android.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Attach APK to this run (Artifacts box)
        uses: actions/upload-artifact@v4
        with:
          name: MFSL-Inventory-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EXE/MSIX & publish to rolling release
        run: ./ci/build-windows.ps1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Attach Windows installer + portable zip to this run (Artifacts box)
        uses: actions/upload-artifact@v4
        with:
          name: MFSL-Inventory-Windows
          path: |
            app/build/windows/x64/runner/Release/MFSL.Inventory.Setup.msix
            ${{ runner.temp }}/MFSL-Inventory-portable.zip
          if-no-files-found: error
