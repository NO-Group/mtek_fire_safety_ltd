# Temporary diagnostics (rerun 2026-09-03f): call the live data-api2 from a GitHub runner
# (the owner's tooling cannot reach Supabase directly). Manual only.
name: Probe data-api2
on:
  workflow_dispatch:
  push:
    branches: [arena/**]
    paths: ['.github/workflows/probe-api.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sign up a probe user, sign in, hit /api/docs/issue
        run: |
          exec > >(tee -a probe.txt) 2>&1
          B=https://kshuadjcflwlidupnqly.supabase.co/functions/v1/data-api2
          E="probe-$GITHUB_RUN_ID@example.com"
          echo "--- health"; curl -s "$B/health"; echo
          echo "--- signup"
          curl -s -X POST "$B/api/auth/signup" -H 'Content-Type: application/json' \
            -d "{\"name\":\"CI Probe\",\"email\":\"$E\",\"phone\":\"0800000000\",\"password\":\"Probe12345!\",\"signature_passcode\":\"4321\",\"recovery_string\":\"probe recovery string here\"}"; echo
          echo "--- login"
          TOK=$(curl -s -X POST "$B/api/auth/login" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$E\",\"password\":\"Probe12345!\"}" | tee /dev/stderr | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("access_token") or d.get("session",{}).get("access_token",""))')
          echo; echo "token len ${#TOK}"
          for r in "GET /api/docs/history" "GET /api/customers" "GET /api/notifications"; do
            set -- $r; echo "--- $r"; curl -s -X $1 "$B$2" -H "Authorization: Bearer $TOK" | head -c 300; echo
          done
          echo "--- issue (expect 403 for sales role, NOT 500)"
          curl -s -X POST "$B/api/docs/issue" -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' \
            -d '{"type":"receipt","customer":"Probe","total":1,"hash":"x","passcode":"","contact":"0800"}'; echo
          echo "--- offline sync import (run twice: second must accept nothing new)"
          BODY='{"device":"probe'$GITHUB_RUN_ID'","customers":[{"offline_key":"probe'$GITHUB_RUN_ID':c:C1","name":"Offline Cust","phone":"0801"}],"sales":[{"offline_key":"probe'$GITHUB_RUN_ID':s:S1:x","id":"S1","customer_id":"probe'$GITHUB_RUN_ID':c:C1","customer_name":"Offline Cust","method":"cash","total":500,"items":[{"product_id":"P1","name":"Ext","qty":1,"unit_price":500}],"created_at":"2026-09-02T10:00:00Z"}],"receipts":[{"offline_key":"probe'$GITHUB_RUN_ID':r:MTK-REC-000000007:x","no":"MTK-REC-000000007","amount":500,"method":"cash","customer_name":"Offline Cust","created_at":"2026-09-02T10:00:00Z"}],"documents":[{"offline_key":"probe'$GITHUB_RUN_ID':d:receipt:2140","doc_type":"receipt","serial":2140,"customer":"Offline Cust","total":500}],"serials":{"receiptIssue":7,"receipt":2140}}'
          curl -s -X POST "$B/api/sync/import" -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' -d "$BODY"; echo
          curl -s -X POST "$B/api/sync/import" -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' -d "$BODY"; echo
          echo "--- history after sync"; curl -s "$B/api/docs/history" -H "Authorization: Bearer $TOK" | head -c 400; echo
          echo "--- mils create (admin-only too)"
          curl -s -X POST "$B/api/customers" -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' \
            -d '{"name":"Probe Customer","phone":"0800"}'; echo
      - name: Publish result where it can be read (release asset + summary)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          R=NO-Group/mtek_fire_safety_ltd
          RID=$(gh api repos/$R/releases/tags/ci -q .id)
          AID=$(gh api repos/$R/releases/$RID/assets -q '.[] | select(.name=="probe.txt") | .id' || true)
          [ -n "$AID" ] && gh api -X DELETE repos/$R/releases/assets/$AID || true
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: text/plain" \
            --data-binary @probe.txt "https://uploads.github.com/repos/$R/releases/$RID/assets?name=probe.txt" >/dev/null
