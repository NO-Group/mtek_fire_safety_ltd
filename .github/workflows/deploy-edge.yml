# ============================================================================
# M-TEK — deploy the data-api Edge Function to Supabase AUTOMATICALLY.
#
# One-time setup (dashboard clicks only — NO bash):
#   1. Copy this file into .github/workflows/deploy-edge.yml
#   2. GitHub repo → Settings → Secrets and variables → Actions →
#      New repository secret:
#        SUPABASE_ACCESS_TOKEN  → Supabase dashboard → Account → Access Tokens
#        SUPABASE_PROJECT_ID    → Supabase dashboard → Project Settings →
#                                 General → Reference ID (kshuadjcflwlidupnqly)
#   3. Supabase dashboard → Edge Functions → Secrets → add:
#        MONGODB_URI, SUPABASE_SECRET_KEY, MTEK_CEO_UID, MTEK_CEO_SIG
#   4. Push (or run this workflow) → function goes live:
#        https://kshuadjcflwlidupnqly.supabase.co/functions/v1/data-api/health
# ============================================================================
name: Deploy Edge Function

on:
  push:
    branches: [main, arena/**]
    paths: ['supabase/functions/**', '.github/workflows/deploy-edge.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the deploy log back for remote diagnostics
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Remove and verify obsolete Auth profile triggers
        run: |
          set -euo pipefail
          # Staff profiles live in MongoDB. Remove every user-defined
          # auth.users trigger, then require the SQL result to prove zero
          # remain. Never mask this repair as a successful deployment.
          SQL=$(cat supabase/migrations/20260908160000_remove_auth_profile_trigger.sql)
          HTTP=$(curl -sS -o /tmp/sql.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg query "$SQL" '{query:$query}')")
          BODY=$(tr '\n' ' ' < /tmp/sql.json | head -c 4000)
          echo "Management API HTTP $HTTP: $BODY"
          if ! test "$HTTP" -ge 200 -a "$HTTP" -lt 300; then
            echo "::error::Auth trigger repair HTTP $HTTP: $BODY"
            exit 1
          fi
          if ! jq -e '.. | objects | select(has("verified")) | .verified == true and .auth_users_user_triggers == 0' /tmp/sql.json >/dev/null; then
            echo "::error::Auth trigger repair was not verified: $BODY"
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - name: Deploy data-api function
        run: |
          set +e
          # Update the one existing production function in place. Never delete
          # it or create numbered replacement functions.
          echo "--- UPDATE existing data-api via CLI ---"
          supabase functions deploy data-api --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID" --debug > /tmp/deploy.log 2>&1
          CODE=$?
          set -e
          echo "supabase functions deploy exit code: $CODE"
          grep -E "No change|Deployed|error|Error" /tmp/deploy.log | tail -6
          grep -q "No change found" /tmp/deploy.log && { echo "::error::CLI said 'No change found' on a FRESH create — delete must have failed"; exit 1; }
          exit $CODE
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # VERIFY the deploy actually landed: /health must return ok:true AND
      # the bundle version baked into index.ts. A past deploy "succeeded"
      # while the project kept serving a stale bundle, which made every new
      # route answer "Unknown API route" — this check makes that visible.
      - name: Verify live bundle version
        run: |
          WANT='2026-09-07-sync1'
          BODY=""
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /tmp/h.json -w '%{http_code}' -A 'mtek-ci-check' "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/data-api/health?poll=${GITHUB_RUN_ID}-$i" || true)
            BODY=$(cat /tmp/h.json 2>/dev/null || true)
            echo "try $i (HTTP $CODE): ${BODY:0:160}"
            case "$BODY" in
              *cloudflare*|*"Just a moment"*|*challenge*) echo "::error::CDN challenge — runner IP blocked from supabase.co"; break;;
            esac
            echo "$BODY" | grep -q "\"version\":\"$WANT\"" && break
            sleep 6
          done
          echo "final /health: $BODY"
          echo "$BODY" | grep -q '"ok":true' || echo "::error::/health never returned ok:true — last body: ${BODY:0:120}"
          echo "$BODY" | grep -q "\"version\":\"$WANT\"" || echo "::error::live bundle version is NOT $WANT — last body: ${BODY:0:120}"
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # TEMPORARY diagnostics: the Actions log host is unreachable from the
      # arena sandbox, so attach the CLI log to the rolling "ci" release
      # instead. Remove once the deploy reliably lands.
      - name: Record deploy log on the ci release
        if: always()
        run: |
          {
            echo "deploy run: $GITHUB_RUN_ID  at: $(date -u '+%Y-%m-%d %H:%M:%SZ')  ref: $GITHUB_REF_NAME  sha: $GITHUB_SHA"
            { echo '--- sql.json ---'; cat /tmp/sql.json 2>/dev/null; echo; cat /tmp/delete.log 2>/dev/null; echo '--- deploy.log ---'; tail -c 24000 /tmp/deploy.log 2>/dev/null; } || echo "(log missing)"
          } > last-edge-deploy.log
          gh release view ci >/dev/null 2>&1 || gh release create ci --prerelease -t "MFSL Inventory - auto builds (rolling)" -n ci
          gh release upload ci last-edge-deploy.log --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
