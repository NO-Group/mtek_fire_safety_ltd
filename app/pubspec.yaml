name: mtek_inventory
description: M-Tek Fire & Safety Ltd — Inventory & Business App (one codebase: Android, Windows, Web/PWA).
publish_to: "none"
version: 0.1.0+m1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0            # ₦ currency + date formatting
  fl_chart: ^0.68.0        # Insights & Summary charts
  pdf: ^3.10.8             # document generation (MILS/Receipt/Invoice)
  printing: ^5.12.0        # print/preview of generated PDFs
  path_provider: ^2.1.3    # local PDF cache (export pipeline)
  share_plus: ^9.0.0       # WhatsApp/email share sheet
  file_picker: ^8.1.2      # real device picks: TXT stock import + MILS photos
  url_launcher: ^6.2.5     # wa.me / mailto deep links (customer directory)

  # Planned for M2/M3 (offline DB, state, backend):
  # drift: ^2.20.0         # local SQLite cache + sync queue
  # flutter_riverpod: ^2.5.1
  # supabase_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/branding/logo_watermark.svg
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
