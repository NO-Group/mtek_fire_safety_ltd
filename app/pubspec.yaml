name: mtek_inventory
description: "MFSL Inventory - Inventory & Business App for M-Tek Fire & Safety Ltd (Android + Windows, one codebase, one live server)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0            # ₦ currency + date formatting
  fl_chart: ^0.68.0        # Insights & Summary charts
  pdf: ^3.10.8             # document generation (MILS/Receipt/Invoice)
  printing: ^5.12.0        # print/preview of generated PDFs
  path_provider: ^2.1.3    # local PDF cache (export pipeline)
  share_plus: ^9.0.0       # WhatsApp/email share sheet
  file_picker: ^8.1.2      # real device picks: TXT stock import + MILS photos
  url_launcher: ^6.2.5     # wa.me / mailto deep links (customer directory)

  # Planned for M2/M3 (offline DB, state, backend):
  # drift: ^2.20.0         # local SQLite cache + sync queue
  # flutter_riverpod: ^2.5.1
  # supabase_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.16.7

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/branding/logo_watermark.svg
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf

msix_config:
  display_name: MFSL Inventory
  publisher_display_name: N.O Group
  publisher: CN=N.O Group
  identity_name: com.mtek.inventory
  msix_version: 1.0.0.0
  logo_path: assets/branding/logo.png
  capabilities: internetClient
  output_path: build\windows\x64\runner\Release
  output_name: MFSL-Inventory-Setup
  # IMPORTANT: build_windows is false because make_exe.bat already ran
  # `flutter build windows --release` itself with the baked-in server
  # --dart-defines. If the msix tool were left to rebuild on its own here,
  # it would run a fresh `flutter build windows` WITHOUT those --dart-define
  # values and silently package an app pointing at no server. Packaging the
  # already-built Release folder as-is keeps the correct server config.
  build_windows: false
  # No certificate_path given -> the msix tool auto-generates and installs a
  # self-signed test certificate on first run, so no manual cert setup is
  # needed on the build machine. Windows will show "Publisher: N.O Group"
  # in the install wizard using this identity.
